name: Desktop Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }} - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: windowsBuild
          - os: ubuntu-latest
            target: linux
            artifact: linuxBuild
          - os: macos-latest
            target: mac
            artifact: macBuild

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        shell: bash
        run: |
          HAXE_VERSION=4.3.7
          echo "Installing Haxe $HAXE_VERSION for ${{ runner.os }} $(uname -m 2>/dev/null || echo unknown)"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "Installing Haxe on Windows $HAXE_VERSION via Chocolatey (handles neko std.ndll correctly)"
            # Prefer choco which correctly installs haxe + neko + std.ndll together
            choco install haxe -y --allow-downgrade 2>/dev/null || choco install haxe -y 2>/dev/null || true
            choco install neko -y 2>/dev/null || true
            echo "C:/ProgramData/chocolatey/bin" >> $GITHUB_PATH
            echo "C:/tools/haxe" >> $GITHUB_PATH
            echo "C:/Program Files/Neko" >> $GITHUB_PATH
            export PATH="$PATH:/c/ProgramData/chocolatey/bin:/c/tools/haxe:/c/Program\ Files/Neko"
            # Verify
            ls -l /c/tools/haxe/haxe.exe 2>/dev/null || ls -l "C:/ProgramData/chocolatey/bin/haxe.exe" 2>/dev/null | head -n 20 || true
            which haxe 2>/dev/null || where haxe 2>/dev/null || find /c/tools -name "haxe.exe" 2>/dev/null | head -n 5 || true
            # Fallback to direct zip only if choco failed
            if ! command -v haxelib >/dev/null 2>&1; then
              echo "choco haxe not found, trying direct download fallback"
              HAXE_URL="https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-win64.zip"
              rm -rf /tmp/haxe.zip /tmp/haxe-extract
              mkdir -p /tmp/haxe-extract
              if wget -q $HAXE_URL -O /tmp/haxe.zip 2>/dev/null || curl -L -o /tmp/haxe.zip $HAXE_URL 2>/dev/null; then
                unzip -q /tmp/haxe.zip -d /tmp/haxe-extract 2>/dev/null || 7z x /tmp/haxe.zip -o/tmp/haxe-extract -y 2>/dev/null || powershell -Command "Expand-Archive -Force /tmp/haxe.zip /tmp/haxe-extract" 2>/dev/null || true
                mkdir -p /c/tools/haxe
                HAXE_EXE=$(find /tmp/haxe-extract -name "haxe.exe" 2>/dev/null | head -n 1)
                if [ -n "$HAXE_EXE" ]; then
                  HAXE_DIR=$(dirname "$HAXE_EXE")
                  cp -r "$HAXE_DIR"/* /c/tools/haxe/ 2>/dev/null || true
                else
                  cp -r /tmp/haxe-extract/* /c/tools/haxe/ 2>/dev/null || true
                fi
                echo "/c/tools/haxe" >> $GITHUB_PATH
                echo "C:/tools/haxe" >> $GITHUB_PATH
                export PATH="$PATH:/c/tools/haxe"
              fi
            fi
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            echo "Installing Haxe via Homebrew (handles arm64/x64 + libneko correctly)"
            # Clean old manual install that has broken @rpath
            sudo rm -rf /usr/local/haxe /usr/local/bin/haxe /usr/local/bin/haxelib 2>/dev/null || true
            brew update 2>/dev/null || true
            # Prefer brew which correctly installs haxe+neko with proper dylib rpath for both Intel and Apple Silicon
            brew install haxe 2>/dev/null || brew upgrade haxe 2>/dev/null || true
            brew install neko 2>/dev/null || brew upgrade neko 2>/dev/null || true
            brew link --overwrite haxe 2>/dev/null || true
            brew link --overwrite neko 2>/dev/null || true
            # Ensure brew paths in PATH for this step and next steps
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            echo "/opt/homebrew/bin" >> $GITHUB_PATH
            echo "/usr/local/bin" >> $GITHUB_PATH
            echo "/opt/homebrew/lib" >> $GITHUB_LD_LIBRARY_PATH 2>/dev/null || true
            # Fixup rpath for manual fallback: ensure libneko can be found at /usr/local/lib for haxelib's @rpath
            sudo mkdir -p /usr/local/lib
            if [ -f /opt/homebrew/lib/libneko.2.dylib ]; then
              sudo ln -sf /opt/homebrew/lib/libneko.2.dylib /usr/local/lib/libneko.2.dylib 2>/dev/null || true
              sudo ln -sf /opt/homebrew/lib/libneko.dylib /usr/local/lib/libneko.dylib 2>/dev/null || true
            fi
            if [ -f /usr/local/Cellar/neko/*/libneko.2.dylib ]; then
              sudo ln -sf /usr/local/Cellar/neko/*/libneko.2.dylib /usr/local/lib/libneko.2.dylib 2>/dev/null || true
            fi
            # Fallback to tarball if brew still not found
            if ! command -v haxe >/dev/null 2>&1; then
              echo "brew haxe failed, trying tarball"
              ARCH=$(uname -m)
              if [[ "$ARCH" == "arm64" ]]; then
                wget -q https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-osx-arm64.tar.gz -O /tmp/haxe.tar.gz || wget -q https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-osx.tar.gz -O /tmp/haxe.tar.gz || true
              else
                wget -q https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-osx.tar.gz -O /tmp/haxe.tar.gz || true
              fi
              if [ -f /tmp/haxe.tar.gz ]; then
                tar -xzf /tmp/haxe.tar.gz -C /tmp || true
                sudo mkdir -p /usr/local/haxe
                sudo cp -R /tmp/haxe*/* /usr/local/haxe/ 2>/dev/null || true
                sudo ln -sf /usr/local/haxe/haxe /usr/local/bin/haxe || true
                sudo ln -sf /usr/local/haxe/haxelib /usr/local/bin/haxelib || true
                # Fix libneko for manual install
                if [ -f /usr/local/haxe/libneko.2.dylib ]; then
                  sudo mkdir -p /usr/local/lib
                  sudo cp /usr/local/haxe/libneko.2.dylib /usr/local/lib/ 2>/dev/null || true
                fi
              fi
            fi
          else
            # Linux
            wget -q https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-linux64.tar.gz -O /tmp/haxe.tar.gz
            tar -xzf /tmp/haxe.tar.gz -C /tmp || true
            sudo mkdir -p /usr/local/haxe
            sudo cp -R /tmp/haxe_*/* /usr/local/haxe/ 2>/dev/null || sudo cp -R /tmp/haxe*/* /usr/local/haxe/ 2>/dev/null || true
            sudo ln -sf /usr/local/haxe/haxe /usr/local/bin/haxe || true
            sudo ln -sf /usr/local/haxe/haxelib /usr/local/bin/haxelib || true
            sudo apt-get update -qq && sudo apt-get install -y neko 2>/dev/null || true
          fi
          haxe --version || echo "haxe not found"
          haxelib version || echo "haxelib not found"

      - name: Restore haxelib cache
        uses: actions/cache@v4
        with:
          path: |
            ~/haxelib
            ${{ github.workspace }}/.haxelib
          key: ${{ runner.os }}-haxelib-lime822-${{ hashFiles('Project.xml') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-lime822-

      - name: Setup haxelib
        shell: bash
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:/c/tools/haxe:/c/ProgramData/chocolatey/bin:$HOME/haxelib:$PATH"
          export DYLD_FALLBACK_LIBRARY_PATH="/opt/homebrew/lib:/usr/local/lib:$DYLD_FALLBACK_LIBRARY_PATH" 2>/dev/null || true
          export DYLD_LIBRARY_PATH="/opt/homebrew/lib:/usr/local/lib:$DYLD_LIBRARY_PATH" 2>/dev/null || true
          echo "PATH=$PATH"
          echo "GITHUB_PATH:"
          cat "$GITHUB_PATH" 2>/dev/null || true
          which haxelib 2>/dev/null || where haxelib 2>/dev/null || find /c/tools -name "haxelib*" 2>/dev/null | head -n 20 || find /usr/local -name "haxelib" 2>/dev/null | head -n 20 || true
          ls -l /c/tools/haxe/ 2>/dev/null | head -n 20 || ls -l /usr/local/bin/haxelib* 2>/dev/null | head -n 20 || true
          haxelib setup ~/haxelib || haxelib setup $HOME/haxelib || true
          haxelib version || true
          haxelib run lime --version 2>&1 || echo "lime not yet installed (will try to install)"

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev libsdl2-dev

      - name: Install Haxelibs
        shell: bash
        run: |
          haxelib install lime 8.2.2 --quiet || haxelib install lime --quiet
          haxelib set lime 8.2.2 2>/dev/null || true
          # Verify lime arch is arm64 compatible
          haxelib list | grep -i lime || true
          ls -l ~/haxelib/lime/8.2.2/ndll/Mac* 2>/dev/null | head -n 20 || ls -l ~/haxelib/lime/*/ndll/Mac* 2>/dev/null | head -n 20 || true
          file ~/haxelib/lime/8.2.2/ndll/Mac64/lime.ndll 2>/dev/null | head -n 5 || file ~/haxelib/lime/*/ndll/Mac64/lime.ndll 2>/dev/null | head -n 5 || true
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib run lime setup flixel --quiet 2>&1 || true
          haxelib run lime setup --quiet 2>&1 || true
          haxelib install flixel-tools --quiet || true
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install hscript --quiet
          haxelib install actuate --quiet
          haxelib install newgrounds --quiet
          haxelib git polymod https://github.com/larsiusprime/polymod.git --quiet || haxelib install polymod --quiet
          haxelib git faxe https://github.com/uhrobots/faxe --quiet || true
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc --quiet || true
          haxelib install extension-webm --quiet || haxelib git extension-webm https://github.com/KadeDev/extension-webm --quiet || echo "extension-webm not available"
          haxelib list

      - name: Rebuild extension-webm
        shell: bash
        run: |
          # Rebuild ndll if missing - extension-webm is desktop only
          if [ -d "$HOME/haxelib/extension-webm" ]; then
            echo "Attempting to rebuild extension-webm for ${{ matrix.target }}"
            haxelib run lime rebuild extension-webm ${{ matrix.target }} 2>&1 || echo "rebuild skipped/failed, continuing"
            ls -R ~/haxelib/extension-webm 2>/dev/null | head -n 100 || true
          else
            echo "extension-webm not installed, skipping rebuild"
          fi

      - name: Build ${{ matrix.target }}
        run: haxelib run lime build ${{ matrix.target }} -release

      - name: Upload Artifact (Windows)
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: export/release/windows/bin
          if-no-files-found: warn

      - name: Upload Artifact (Linux)
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: export/release/linux/bin
          if-no-files-found: warn

      - name: Upload Artifact (macOS)
        if: matrix.target == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: export/release/macos/bin
          if-no-files-found: warn
