name: Mobile Build (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  buildAndroid:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 11)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Haxe
        shell: bash
        run: |
          HAXE_VERSION=4.3.7
          echo "Installing Haxe $HAXE_VERSION for ${{ runner.os }} $(uname -m 2>/dev/null || echo unknown)"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            choco install haxe --version $HAXE_VERSION -y --allow-downgrade || true
            # Ensure haxe in PATH
            echo "C:/ProgramData/chocolatey/bin" >> $GITHUB_PATH || true
            echo "C:/tools/haxe" >> $GITHUB_PATH || true
            export PATH="$PATH:/c/ProgramData/chocolatey/bin:/c/tools/haxe"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            ARCH=$(uname -m)
            echo "Mac arch: $ARCH"
            if [[ "$ARCH" == "arm64" ]]; then
              # Try arm64 tarball first, fallback to x64
              wget -q https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-osx-arm64.tar.gz -O /tmp/haxe.tar.gz || wget -q https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-osx.tar.gz -O /tmp/haxe.tar.gz || brew install haxe || true
              if [ -f /tmp/haxe.tar.gz ]; then
                tar -xzf /tmp/haxe.tar.gz -C /tmp || true
                sudo mkdir -p /usr/local/haxe
                sudo cp -R /tmp/haxe*/* /usr/local/haxe/ 2>/dev/null || sudo cp -R /tmp/haxe_*/* /usr/local/haxe/ 2>/dev/null || true
                sudo ln -sf /usr/local/haxe/haxe /usr/local/bin/haxe || true
                sudo ln -sf /usr/local/haxe/haxelib /usr/local/bin/haxelib || true
              fi
              brew install neko 2>/dev/null || true
            else
              wget -q https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-osx.tar.gz -O /tmp/haxe.tar.gz || brew install haxe || true
              if [ -f /tmp/haxe.tar.gz ]; then
                tar -xzf /tmp/haxe.tar.gz -C /tmp || true
                sudo mkdir -p /usr/local/haxe
                sudo cp -R /tmp/haxe*/* /usr/local/haxe/ 2>/dev/null || true
                sudo ln -sf /usr/local/haxe/haxe /usr/local/bin/haxe || true
                sudo ln -sf /usr/local/haxe/haxelib /usr/local/bin/haxelib || true
              fi
            fi
          else
            # Linux
            wget -q https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-linux64.tar.gz -O /tmp/haxe.tar.gz
            tar -xzf /tmp/haxe.tar.gz -C /tmp || true
            sudo mkdir -p /usr/local/haxe
            sudo cp -R /tmp/haxe_*/* /usr/local/haxe/ 2>/dev/null || sudo cp -R /tmp/haxe*/* /usr/local/haxe/ 2>/dev/null || true
            sudo ln -sf /usr/local/haxe/haxe /usr/local/bin/haxe || true
            sudo ln -sf /usr/local/haxe/haxelib /usr/local/bin/haxelib || true
            sudo apt-get update -qq && sudo apt-get install -y neko 2>/dev/null || true
          fi
          haxe --version || echo "haxe not found"
          haxelib version || echo "haxelib not found"

      - name: Restore haxelib cache
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: ubuntu-haxelib-mobile-${{ hashFiles('Project.xml') }}
          restore-keys: |
            ubuntu-haxelib-mobile-

      - name: Setup haxelib
        shell: bash
        run: |
          haxelib setup ~/haxelib
          haxelib version

      - name: Setup Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Install Haxelibs
        shell: bash
        run: |
          haxelib install lime 8.1.0 --quiet || haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib run lime setup flixel --quiet || true
          haxelib run lime setup --quiet || true
          haxelib install flixel-tools --quiet || true
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install hscript --quiet
          haxelib install actuate --quiet
          haxelib install newgrounds --quiet
          haxelib git polymod https://github.com/larsiusprime/polymod.git --quiet || haxelib install polymod --quiet
          haxelib git faxe https://github.com/uhrobots/faxe --quiet || true
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc --quiet || true
          haxelib git extension-webm https://github.com/KadeDev/extension-webm --quiet || true
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools.git --quiet || true
          haxelib list

      - name: Setup lime for Android
        shell: bash
        run: |
          haxelib run lime setup android --quiet || true
          # Accept licenses
          yes | sdkmanager --licenses || true
          sdkmanager --update || true

      - name: Build Android (Debug)
        run: haxelib run lime build android -debug

      - name: Build Android (Release)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: haxelib run lime build android -final

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: |
            export/debug/android/bin/app/build/outputs/apk/debug/*.apk
            export/release/android/bin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Android Release APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            export/release/android/bin/app/build/outputs/apk/release/*.apk
            export/final/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  buildIOS:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        shell: bash
        run: |
          HAXE_VERSION=4.3.7
          echo "Installing Haxe $HAXE_VERSION for ${{ runner.os }} $(uname -m 2>/dev/null || echo unknown)"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            choco install haxe --version $HAXE_VERSION -y --allow-downgrade || true
            # Ensure haxe in PATH
            echo "C:/ProgramData/chocolatey/bin" >> $GITHUB_PATH || true
            echo "C:/tools/haxe" >> $GITHUB_PATH || true
            export PATH="$PATH:/c/ProgramData/chocolatey/bin:/c/tools/haxe"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            ARCH=$(uname -m)
            echo "Mac arch: $ARCH"
            if [[ "$ARCH" == "arm64" ]]; then
              # Try arm64 tarball first, fallback to x64
              wget -q https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-osx-arm64.tar.gz -O /tmp/haxe.tar.gz || wget -q https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-osx.tar.gz -O /tmp/haxe.tar.gz || brew install haxe || true
              if [ -f /tmp/haxe.tar.gz ]; then
                tar -xzf /tmp/haxe.tar.gz -C /tmp || true
                sudo mkdir -p /usr/local/haxe
                sudo cp -R /tmp/haxe*/* /usr/local/haxe/ 2>/dev/null || sudo cp -R /tmp/haxe_*/* /usr/local/haxe/ 2>/dev/null || true
                sudo ln -sf /usr/local/haxe/haxe /usr/local/bin/haxe || true
                sudo ln -sf /usr/local/haxe/haxelib /usr/local/bin/haxelib || true
              fi
              brew install neko 2>/dev/null || true
            else
              wget -q https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-osx.tar.gz -O /tmp/haxe.tar.gz || brew install haxe || true
              if [ -f /tmp/haxe.tar.gz ]; then
                tar -xzf /tmp/haxe.tar.gz -C /tmp || true
                sudo mkdir -p /usr/local/haxe
                sudo cp -R /tmp/haxe*/* /usr/local/haxe/ 2>/dev/null || true
                sudo ln -sf /usr/local/haxe/haxe /usr/local/bin/haxe || true
                sudo ln -sf /usr/local/haxe/haxelib /usr/local/bin/haxelib || true
              fi
            fi
          else
            # Linux
            wget -q https://github.com/HaxeFoundation/haxe/releases/download/${HAXE_VERSION}/haxe-${HAXE_VERSION}-linux64.tar.gz -O /tmp/haxe.tar.gz
            tar -xzf /tmp/haxe.tar.gz -C /tmp || true
            sudo mkdir -p /usr/local/haxe
            sudo cp -R /tmp/haxe_*/* /usr/local/haxe/ 2>/dev/null || sudo cp -R /tmp/haxe*/* /usr/local/haxe/ 2>/dev/null || true
            sudo ln -sf /usr/local/haxe/haxe /usr/local/bin/haxe || true
            sudo ln -sf /usr/local/haxe/haxelib /usr/local/bin/haxelib || true
            sudo apt-get update -qq && sudo apt-get install -y neko 2>/dev/null || true
          fi
          haxe --version || echo "haxe not found"
          haxelib version || echo "haxelib not found"

      - name: Restore haxelib cache
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: macos-haxelib-ios-${{ hashFiles('Project.xml') }}
          restore-keys: |
            macos-haxelib-ios-

      - name: Setup haxelib
        shell: bash
        run: |
          haxelib setup ~/haxelib
          haxelib version

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
          xcodebuild -version
          xcode-select -p

      - name: Install Haxelibs
        shell: bash
        run: |
          haxelib install lime 8.1.0 --quiet || haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib run lime setup flixel --quiet || true
          haxelib run lime setup --quiet || true
          haxelib install flixel-tools --quiet || true
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install hscript --quiet
          haxelib install actuate --quiet
          haxelib install newgrounds --quiet
          haxelib git polymod https://github.com/larsiusprime/polymod.git --quiet || haxelib install polymod --quiet
          haxelib git faxe https://github.com/uhrobots/faxe --quiet || true
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc --quiet || true
          haxelib git extension-webm https://github.com/KadeDev/extension-webm --quiet || true
          haxelib list

      - name: Setup lime for iOS
        run: haxelib run lime setup ios --quiet || true

      - name: Build iOS (Debug - Simulator)
        run: haxelib run lime build ios -debug -simulator

      - name: Build iOS (Release)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: haxelib run lime build ios -final || haxelib run lime build ios -release || true

      - name: Upload iOS Debug Export
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug
          path: |
            export/debug/ios/bin
            export/release/ios/bin
            export/ios/bin
          if-no-files-found: warn

      - name: Upload iOS Release IPA (if signed)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: |
            export/release/ios/build/**/*.ipa
            export/ios/build/**/*.ipa
          if-no-files-found: warn
